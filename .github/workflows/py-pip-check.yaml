on:
  push:
    branches: [main, master, 'hotfix/*', 'release/*', develop, 'feature/py-*', 'feature/*-withci']
  pull_request:
    branches: [main, master, 'hotfix/*', 'release/*', develop]
  
name: py-pip-check
  
jobs:
  build:
    runs-on: ${{ matrix.os }}

    if: ${{ !contains(github.event.head_commit.message, '[skip py]') }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    
    defaults:
      run:
        working-directory: python
    
    name: ${{ matrix.os }} (${{ matrix.python-version }})

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install requirements
        run: |
          pip install --upgrade pip
          pip install -r requirements/requirements.txt
      
      - name: Verify pip
        run: pip list

      - name: Install
        run: pip install -e . -v
      
      - name: Verify installation
        run: pip list
      
      - name: OpenMP check
        run: python -c "from bvhar.utils import checkomp; checkomp.check_omp()"
      
      - name: Test
        run: pytest
